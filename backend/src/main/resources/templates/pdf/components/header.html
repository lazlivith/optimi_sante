<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
      En-tete commune a tous les documents.

      Le logo est embarque en base64 (voir MarqueAssets) : le rendu part d'une chaine HTML sans
      adresse de base, et l'application vit dans un .jar ou une ressource n'est pas un fichier.
      Une palette de 16 couleurs suffit a un trace noir : 7 Ko au lieu de 29.

      Si le fichier venait a manquer, le nom s'ecrit en toutes lettres plutot que de laisser un
      cadre vide : un document sans logo reste un document.
    -->
    <div th:fragment="header" class="header">
        <table width="100%" style="border-bottom: 2px solid #117098; padding-bottom: 10px;">
            <tr>
                <td width="55%">
                    <img th:if="${marque.logoDisponible()}" th:src="${marque.logoDataUri()}"
                         alt="Optimi Santé" style="height: 42px;" />
                    <h1 th:unless="${marque.logoDisponible()}"
                        style="color: #117098; margin: 0; font-size: 24px;">Optimi Santé</h1>
                    <p style="margin: 5px 0 0 0; color: #555; font-size: 11px;">soutenir le handicap et le soin.</p>
                </td>
                <td width="45%" style="text-align: right; vertical-align: top;">
                    <!-- Le numero d'agrement etait ecrit en dur, comme l'etait le SIRET : il sort
                         en configuration, et s'affiche « a completer » tant qu'il n'est pas
                         renseigne plutot que d'annoncer une immatriculation inventee. -->
                    <p th:if="${societe.numeroAgrement() != null and !societe.numeroAgrement().isBlank()}"
                       style="margin: 0; font-size: 13px; font-weight: bold; color: #117098;">
                        N° d'agrément
                    </p>
                    <p th:if="${societe.numeroAgrement() != null and !societe.numeroAgrement().isBlank()}"
                       style="margin: 4px 0 0 0; font-size: 12px; color: #555;"
                       th:text="${societe.numeroAgrement()}">—</p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
