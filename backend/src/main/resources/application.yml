spring:
  application:
    name: optimisante-backend
  profiles:
    active: dev
  servlet:
    multipart:
      # Relevé au-delà du défaut (1 MB) pour permettre l'upload d'une courte vidéo
      # d'illustration de formation (image de formation, brochures restent bien en-dessous).
      # 55 Mo, soit au-dessus de la limite métier de 50 Mo appliquée par ProductMediaService.
      # Cet ordre compte : si le servlet refusait en premier, l'administrateur recevrait une
      # erreur technique au lieu du message qui nomme la limite et la taille de son fichier.
      max-file-size: 55MB
      # Une galerie se dépose en plusieurs visuels à la fois : la requête porte davantage que
      # le plus gros fichier seul.
      max-request-size: 120MB

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://127.0.0.1:5051/optimisante_db
    username: postgres
    password: Investx2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: OptimisanteHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # `validate` (et non `update`) : le schéma est piloté EXCLUSIVEMENT par Flyway.
      # Historique : `update` laissait Hibernate corriger lui-même la base à chaque
      # démarrage, masquant le fait que V7 (CREATE TABLE IF NOT EXISTS sur des tables
      # déjà créées par V1) n'avait jamais rien créé — 9 colonnes n'existaient qu'en dev
      # et l'application n'aurait pas démarré sur une base neuve. Réaligné par V22.
      # Garder `validate` : toute divergence entité/migration doit échouer ICI, au
      # démarrage en dev, et non silencieusement jusqu'en production.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

app:
  security:
    jwt:
      secret: ${JWT_SECRET:default-dev-secret-key-at-least-32-chars-long!}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  mail:
    from: ${MAIL_FROM:no-reply@optimisante.fr}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    mailtrap:
      # Facultatifs : alimentent les statistiques de délivrabilité de l'espace
      # « Emails » de l'admin. Sans eux, l'écran fonctionne avec les seules
      # statistiques du journal local (aucune erreur, message explicite affiché).
      api-token: ${MAILTRAP_API_TOKEN:}
      account-id: ${MAILTRAP_ACCOUNT_ID:}
  doctor-application:
    # Valeur de repli, appliquée quand la formation ne fixe pas ses propres frais
    # (trainings.application_fee, V40).
    #
    # 100,00 € et non 50,00 : la valeur de John date d'avant la V40. Le montant est annoncé
    # dans les CGV, un écart entre le contrat et la caisse est un incident déjà survenu.
    fee-amount: ${DOCTOR_APPLICATION_FEE:100.00}
  tuition:
    # Part des frais de formation exigée à l'admission (acompte). Le solde est appelé à la
    # délivrance du visa.
    #
    # ⚠️ Trois endroits portent cette valeur et doivent rester alignés : ce fichier,
    # `TUITION_DEPOSIT_RATE` dans docker-compose.yml — qui prime sur ce défaut — et
    # `VITE_LEGAL_PART_ACOMPTE` côté frontend, qui alimente les CGV. Annoncer un taux dans le
    # contrat et en prélever un autre est exactement l'incident survenu sur les frais de dossier.
    deposit-rate: ${TUITION_DEPOSIT_RATE:60}
  reporting:
    # Worker Python FastAPI de reporting analytique. Vide => fonctionnalité "Rapports" désactivée
    # proprement (message explicite côté admin). docker-compose fournit http://analytics:8100.
    worker-base-url: ${REPORTING_WORKER_URL:}
  ai:
    # Service IA Python (extraction documentaire Gemini, assistant Mistral). Vide => toutes les
    # fonctions IA sont désactivées proprement. docker-compose fournit http://ai:8200.
    worker-base-url: ${AI_WORKER_URL:}
  aws:
    s3:
      endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
      region: ${AWS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY:test}
      secret-key: ${AWS_SECRET_KEY:test}
      bucket: ${AWS_S3_BUCKET:optimisante-docs-dev}
    kms:
      endpoint: ${AWS_KMS_ENDPOINT:http://localhost:4566}
      key-id: ${AWS_KMS_KEY_ID:default-kms-key-id}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:default}
    api-key: ${CLOUDINARY_API_KEY:default}
    api-secret: ${CLOUDINARY_API_SECRET:default}

stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_PLACEHOLDER}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_PLACEHOLDER}
  currency: eur

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  aws:
    s3:
      region: ${AWS_REGION}
      bucket: ${AWS_S3_BUCKET}
