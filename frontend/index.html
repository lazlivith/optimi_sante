<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- La favicon precedente etait une icone violette generique, sans rapport avec la
         marque. Celle-ci est provisoire : la « griffe » de la charte — le S seul, concu
         precisement pour les petites tailles — ne figure dans aucun fichier livre, et elle
         ne peut pas etre decoupee proprement dans le verrouillage. A remplacer des que le
         graphiste la fournit. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/marque/optimi-icone-180.png" />
    <meta name="theme-color" content="#117098" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Source Sans 3 : la police secondaire de la charte, en version variable. C'est le
         premier chargement de police du projet — « Inter » etait declaree dans index.css
         sans jamais etre chargee, et le site rendait donc en police systeme.
         preconnect avant le lien : sans lui, la resolution DNS et la negociation TLS
         s'ajoutent au delai d'affichage du texte. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..700;1,400&display=swap"
    />

    <title>Optimi Santé — Négoce médical & Mobilité clinique</title>
    <meta
      name="description"
      content="Optimi Santé : dispositifs médicaux certifiés CE, formations cliniques dans les CHU partenaires et accompagnement mobilité médicale Afrique → France."
    />
    <meta name="robots" content="index, follow" />
    <!-- La canonique n'est PAS figée ici : elle dépend du domaine, et doit varier d'une page
         à l'autre. Elle est posée par usePageMeta à partir de VITE_SITE_URL, et n'est émise
         que si ce domaine est renseigné. Une canonique absente vaut infiniment mieux qu'une
         canonique fausse : celle qui se trouvait ici désignait un domaine redirigeant (301)
         vers l'ancien site WordPress, à qui elle offrait le référencement de nos pages. -->

    <!-- Open Graph / réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Optimi Santé" />
    <meta property="og:title" content="Optimi Santé — Négoce médical & Mobilité clinique" />
    <meta
      property="og:description"
      content="Dispositifs médicaux certifiés CE, formations cliniques dans les CHU partenaires et accompagnement mobilité médicale Afrique → France."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
