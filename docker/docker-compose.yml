services:
  postgres:
    image: postgres:16-alpine
    container_name: optimisante-postgres
    ports:
      - "5051:5432"
    environment:
      POSTGRES_DB: optimisante_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Investx2026
    volumes:
      - optimisante-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: optimisante-redis
    ports:
      # Port hôte 6380 (6379 déjà utilisé par un autre projet sur cette machine).
      # Le backend joint Redis via "redis:6379" sur le réseau Docker interne.
      - "6380:6379"
    volumes:
      - optimisante-redisdata:/data
    restart: unless-stopped

  # Service localstack (émulation AWS S3/KMS) retiré : le backend n'a jamais utilisé
  # le SDK AWS (vérifié : aucune dépendance, aucun appel S3Client/KmsClient dans le
  # code), le stockage réel passe entièrement par Cloudinary. Le service ne faisait
  # que crash-looper (l'image :latest exige désormais une licence LocalStack) sans
  # jamais être sollicité par l'application.

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: optimisante-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/optimisante_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Investx2026
      - SPRING_DATA_REDIS_HOST=redis
      # Identifiants Cloudinary reels dans docker/.env (jamais pousse sur Git) - voir
      # docker/.env.example pour la marche a suivre.
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - JWT_SECRET=default-dev-secret-key-at-least-32-chars-long!
      # Identifiants Mailtrap à renseigner une fois le compte créé (mailtrap.io, gratuit) —
      # tant qu'ils sont vides, l'envoi d'email échouera proprement (erreur loggée, sans
      # bloquer le reste du parcours).
      - MAIL_HOST=${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@optimisante.fr}
      # Statistiques de délivrabilité dans l'espace « Emails » de l'admin (facultatif).
      - MAILTRAP_API_TOKEN=${MAILTRAP_API_TOKEN:-}
      - MAILTRAP_ACCOUNT_ID=${MAILTRAP_ACCOUNT_ID:-}
      - FRONTEND_BASE_URL=http://localhost:5173
      # Repli quand la formation ne fixe pas ses propres frais (trainings.application_fee, V40).
      # Doit rester aligne sur VITE_LEGAL_FRAIS_DOSSIER cote frontend, faute de quoi la page
      # annoncerait un montant et la caisse en preleverait un autre.
      - DOCTOR_APPLICATION_FEE=${DOCTOR_APPLICATION_FEE:-100.00}
      # Acompte exigé à l'admission, solde à la délivrance du visa. Doit rester aligné sur
      # `app.tuition.deposit-rate` (application.yml) et sur VITE_LEGAL_PART_ACOMPTE (CGV).
      - TUITION_DEPOSIT_RATE=${TUITION_DEPOSIT_RATE:-60}
      # Clés Stripe à renseigner une fois disponibles (dashboard.stripe.com, mode Test) —
      # tant qu'elles sont absentes, le paiement échoue proprement (erreur loggée : "Invalid
      # API Key"), sans bloquer le reste du parcours ni corrompre de données.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_PLACEHOLDER}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_PLACEHOLDER}
      # Worker Python de reporting (Sprint 5). Absent => onglet "Rapports" désactivé proprement.
      - REPORTING_WORKER_URL=http://analytics:8100
      # Service IA (extraction Gemini + assistant Mistral). Absent => fonctions IA désactivées.
      - AI_WORKER_URL=http://ai:8200
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Sprint 5 — Worker Python FastAPI : rapports batch nocturnes & exports analytiques à la demande.
  analytics:
    build:
      context: ../workers/analytics_service
      dockerfile: Dockerfile
    container_name: optimisante-analytics
    ports:
      - "8100:8100"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:Investx2026@postgres:5432/optimisante_db
      - EXPORT_DIR=/exports
      - SCHEDULER_ENABLED=true
      - SCHEDULE_CRON_HOUR=2
      - SCHEDULE_CRON_MINUTE=0
    volumes:
      - optimisante-exports:/exports
    depends_on:
      - postgres
    restart: unless-stopped

  # Service IA — extraction documentaire (Gemini) & assistant conversationnel (Mistral).
  # Sans clé API, le conteneur démarre quand même : /health annonce les capacités comme
  # désactivées et le backend affiche un message explicite. Rien d'autre n'est bloqué.
  ai:
    build:
      context: ../workers/ai_service
      dockerfile: Dockerfile
    container_name: optimisante-ai
    ports:
      - "8200:8200"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - EXTRACTION_MODEL=${EXTRACTION_MODEL:-gemini/gemini-3.6-flash}
      - CHAT_MODEL=${CHAT_MODEL:-mistral/mistral-small-latest}
      - DRAFT_MODEL=${DRAFT_MODEL:-mistral/mistral-small-latest}
      - BACKEND_BASE_URL=http://backend:8080
      - DATABASE_URL=postgresql+psycopg2://postgres:Investx2026@postgres:5432/optimisante_db
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  optimisante-pgdata:
  optimisante-redisdata:
  optimisante-exports:
